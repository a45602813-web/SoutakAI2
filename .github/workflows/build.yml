name: Build Soutak AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q SoutakAI.zip
          find SoutakAI -maxdepth 2 -type f | head -50

      - name: Build APK
        working-directory: SoutakAI
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoutakAI-APK
          path: SoutakAI/app/build/outputs/apk/debug/app-debug.apk
