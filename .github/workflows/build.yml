name: Build Soutak AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Extract project
        run: |
          unzip -q SoutakAI.zip
          
          # Use a compatible Android Gradle Plugin
          sed -i 's/com.android.application") version "9.4.0"/com.android.application") version "9.3.1"/' SoutakAI/build.gradle.kts
          
          # Use current stable Kotlin
          sed -i 's/org.jetbrains.kotlin.android") version "2.4.10"/org.jetbrains.kotlin.android") version "2.4.20"/' SoutakAI/build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.plugin.compose") version "2.4.10"/org.jetbrains.kotlin.plugin.compose") version "2.4.20"/' SoutakAI/build.gradle.kts

          echo "=== Build files ==="
          cat SoutakAI/build.gradle.kts

      - name: Build Debug APK
        run: |
          gradle -p SoutakAI assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoutakAI-debug-apk
          path: SoutakAI/app/build/outputs/apk/debug/app-debug.apk
